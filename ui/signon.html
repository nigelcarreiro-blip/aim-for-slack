<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sign On</title>
<link rel="stylesheet" href="xp.css">
<style>
  .client { padding: 0; align-items: stretch; }
  .logo { background: #00008b; display: grid; place-items: center; height: 168px; border-bottom: 1px solid #000; }
  .logo img { width: 190px; height: 150px; image-rendering: pixelated; }
  form { padding: 10px 14px 0; display: flex; flex-direction: column; gap: 3px; }
  label { font-weight: bold; color: #000; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
  label .man { width: 14px; height: 16px; background: var(--man) center / contain no-repeat; }
  label .key { width: 14px; height: 14px; }
  select, input[type=password] { width: 100%; font: 11px var(--font); height: 21px; }
  select { border: 1px solid var(--edge); background: #fff; }
  .links { display: flex; justify-content: flex-end; font-size: 11px; }
  .checks { display: flex; gap: 12px; margin: 8px 0 4px; }
  .checks label { font-weight: normal; margin: 0; gap: 3px; }
  .bottom { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 12px 10px; }
  .small-btns { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; }
  .small-btns .ico { width: 30px; height: 26px; display: grid; place-items: center; }
  .signon {
    width: 64px; height: 58px; border: 1px solid #003c74; border-radius: 4px; background: var(--raise);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 11px var(--font);
  }
  .signon:hover { box-shadow: inset 0 0 0 2px #f8b636; }
  .signon .man { width: 26px; height: 31px; background: var(--man) center / contain no-repeat; }
  .version { text-align: center; color: #555; font-size: 10px; padding-bottom: 6px; }
  #progress { display: none; padding: 16px 16px 0; }
  #progress div { padding: 5px 0 5px 20px; color: #888; position: relative; }
  #progress div.on { color: #000; font-weight: bold; }
  #progress div.on::before { content: ""; position: absolute; left: 0; top: 3px; width: 14px; height: 16px; background: var(--man) center / contain no-repeat; }
  #progress .err { color: #c00; font-weight: normal; padding-left: 0; }
  body.connecting form, body.connecting .bottom { display: none; }
  body.connecting #progress { display: block; }
</style>
</head>
<body>
<div class="client">
  <div class="logo"><img src="../assets/img/signon-logo.png" alt=""></div>
  <form id="f" onsubmit="return false">
    <label><span class="man"></span>ScreenName</label>
    <select id="sn"><option>Loading...</option></select>
    <div class="links"><a>Get a Screen Name</a></div>
    <label><svg class="key" viewBox="0 0 14 14"><circle cx="4.5" cy="7" r="3" fill="#f0c020" stroke="#7a5a00"/><path d="M7 7h6M11 7v3M13 7v2" stroke="#7a5a00" stroke-width="1.6"/></svg>Password</label>
    <input type="password" value="slackslack" readonly>
    <div class="links"><a>Forgot Password?</a></div>
    <div class="checks">
      <label><input type="checkbox" checked disabled> Save password</label>
      <label><input type="checkbox" id="auto"> Auto-login</label>
    </div>
  </form>
  <div id="progress">
    <div id="s1">1. Connecting...</div>
    <div id="s2">2. Verifying username and password...</div>
    <div id="s3">3. Starting services...</div>
    <div id="err" class="err"></div>
  </div>
  <div class="bottom">
    <div class="small-btns"><div class="ico"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="#3a78d8" stroke="#123a80"/><text x="11" y="15.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" font-family="Tahoma">?</text></svg></div>Help</div>
    <div class="small-btns" id="setup"><div class="ico"><svg width="24" height="22" viewBox="0 0 24 22"><rect x="2" y="3" width="20" height="14" rx="1" fill="#dfe8f6" stroke="#46608c"/><rect x="4" y="5" width="16" height="10" fill="#3a6fd0"/><path d="M8 20h8M12 17v3" stroke="#46608c" stroke-width="2"/></svg></div>Setup</div>
    <button class="signon" id="go"><span class="man"></span>Sign On</button>
  </div>
  <div class="version">Version: 5.5.3595</div>
</div>
<script src="common.js"></script>
<script>
  titlebar('Sign On', { max: false });
  const auto = document.getElementById('auto');
  try { auto.checked = localStorage.getItem('aim-auto') === '1'; } catch {}
  auto.onchange = () => { try { localStorage.setItem('aim-auto', auto.checked ? '1' : '0'); } catch {} };

  aim.invoke('screen-name').then(name => {
    document.getElementById('sn').innerHTML = `<option>${escapeHtml(name || 'Slack (not running)')}</option>`;
    if (auto.checked && name) signOn();
  });

  const step = n => ['s1', 's2', 's3'].forEach((id, i) => document.getElementById(id).classList.toggle('on', i === n));
  async function signOn() {
    document.body.classList.add('connecting');
    step(0);
    const t1 = setTimeout(() => step(1), 700), t2 = setTimeout(() => step(2), 1400);
    try {
      await new Promise(r => setTimeout(r, 1500));
      await aim.invoke('signon');
    } catch (e) {
      clearTimeout(t1); clearTimeout(t2);
      document.getElementById('err').textContent = String(e.message || e).replace(/^Error invoking remote method 'signon': (Error: )?/, '');
      setTimeout(() => document.body.classList.remove('connecting'), 3500);
    }
  }
  document.getElementById('go').onclick = signOn;
  document.getElementById('setup').onclick = () => aim.invoke('open-prefs');
  document.addEventListener('keydown', e => { if (e.key === 'Enter') signOn(); });
</script>
</body>
</html>
