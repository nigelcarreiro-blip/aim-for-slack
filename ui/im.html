<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Instant Message</title>
<link rel="stylesheet" href="xp.css">
<style>
  .warn { padding-right: 6px; white-space: nowrap; }
  .pane { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 4px 4px 0; gap: 0; }
  #log {
    flex: 1; min-height: 60px; overflow-y: auto; padding: 4px 6px; user-select: text; cursor: text;
    font: 13px Arial, sans-serif; line-height: 1.3; border: 1px solid var(--edge); background: #fff;
    box-shadow: inset 1px 1px 0 #c3c3c3;
  }
  .msg { margin: 1px 0; word-wrap: break-word; }
  .msg .who { font-weight: bold; color: #0000ff; }
  .msg.self .who { color: #ff0000; }
  .msg .ts { color: #808080; font-size: 11px; font-weight: normal; }
  .msg .mention { color: #0000ff; }
  .msg code { font: 12px "Courier New", monospace; background: #f4f4f4; }
  .msg pre { font: 12px "Courier New", monospace; margin: 2px 0; white-space: pre-wrap; background: #f4f4f4; padding: 2px 4px; }
  .msg .extra { color: #555; font-size: 12px; }
  .note { color: #808080; font-style: italic; font-size: 11px; margin: 4px 0; }
  .sys { color: #808080; font-size: 11px; text-align: center; margin: 4px 0 6px; }
  .split { height: 5px; flex: none; cursor: ns-resize; }
  .fmt { display: flex; align-items: center; gap: 1px; height: 26px; flex: none; padding: 0 4px; background: var(--beige); border: 1px solid #aca899; border-bottom: none; }
  .fmt button { width: 23px; height: 22px; padding: 0; border: 1px solid transparent; border-radius: 2px; background: none; font: bold 12px "Times New Roman", serif; color: #000; display: grid; place-items: center; }
  .fmt button:hover { border-color: #aca899; background: var(--raise); }
  .fmt .sep { width: 1px; height: 16px; background: #aca899; margin: 0 4px; box-shadow: 1px 0 0 #fff; }
  .fmt .a-color { color: #2040c0; text-decoration: underline; text-decoration-color: #2040c0; }
  .fmt .a-bg { background: #2040c0 !important; color: #fff; border-radius: 1px; width: 15px; height: 15px; font-size: 11px; }
  .fmt .link { font: bold 11px Tahoma; color: #00f; text-decoration: underline; }
  #input {
    flex: none; height: 74px; resize: none; padding: 4px 6px; font: 13px Arial, sans-serif;
    border: 1px solid var(--edge); box-shadow: inset 1px 1px 0 #c3c3c3; user-select: text;
  }
  .typing { flex: none; height: 14px; font-size: 10px; color: #666; padding: 1px 6px 0; }
  .bottom { flex: none; display: flex; align-items: flex-end; gap: 2px; padding: 3px 4px 4px; border-top: 1px solid #fff; box-shadow: 0 -1px 0 #aca899; margin-top: 2px; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10px; padding: 2px 3px; border: 1px solid transparent; border-radius: 3px; min-width: 38px; }
  .tool:hover { border-color: #aca899; background: var(--raise); }
  .tool svg { width: 26px; height: 24px; }
  .tool .spacer { flex: 1; }
  .grow { flex: 1; }
  .send { width: 56px; height: 46px; border: 1px solid #003c74; border-radius: 4px; background: var(--raise); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 11px var(--font); }
  .send:hover { box-shadow: inset 0 0 0 2px #f8b636; }
  .send .man { width: 22px; height: 26px; background: var(--man) center / contain no-repeat; }
  .send:disabled { opacity: .55; }
  .emoji-pop { display: none; position: absolute; bottom: 150px; left: 230px; background: #fff; border: 1px solid #aca899; box-shadow: 2px 2px 3px rgba(0,0,0,.35); padding: 3px; grid-template-columns: repeat(6, 24px); z-index: 20; }
  .emoji-pop.open { display: grid; }
  .emoji-pop span { font-size: 16px; text-align: center; padding: 2px; }
  .emoji-pop span:hover { background: var(--select); }
  .warnflash { animation: wf .4s 3; }
  @keyframes wf { 50% { color: #f00; } }
</style>
</head>
<body>
<div class="client">
  <div class="pane">
    <div id="log"></div>
    <div class="split" id="split"></div>
    <div class="fmt">
      <button class="a-color" title="Text Color">A</button>
      <button title="Background Color"><span class="a-bg">A</span></button>
      <div class="sep"></div>
      <button title="Decrease Font Size" style="font-size:10px">A<sup style="font-size:7px">▼</sup></button>
      <button title="Normal Font Size">A</button>
      <button title="Increase Font Size" style="font-size:15px">A<sup style="font-size:7px">▲</sup></button>
      <div class="sep"></div>
      <button id="b-b" title="Bold">B</button>
      <button id="b-i" title="Italic"><i>I</i></button>
      <button id="b-u" title="Strikethrough"><u>U</u></button>
      <div class="sep"></div>
      <button id="b-link" class="link" title="Insert Link">link</button>
      <button id="b-pic" title="Insert Picture (open in Slack)"><svg width="16" height="14" viewBox="0 0 16 14"><rect x=".5" y=".5" width="15" height="13" fill="#bfe0ff" stroke="#446"/><path d="M1 13l5-6 3 4 2-2 4 4z" fill="#3a8a3a"/><circle cx="12" cy="4" r="1.6" fill="#ffd400"/></svg></button>
      <button id="b-mail" title="Send Email"><svg width="16" height="12" viewBox="0 0 16 12"><rect x=".5" y=".5" width="15" height="11" fill="#fffbe0" stroke="#776"/><path d="M1 1l7 6 7-6" fill="none" stroke="#776"/></svg></button>
      <button id="b-smile" title="Insert Smiley"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#ffd400" stroke="#8a6a00"/><circle cx="5.5" cy="6" r="1" fill="#000"/><circle cx="10.5" cy="6" r="1" fill="#000"/><path d="M4.5 9.5q3.5 3.5 7 0" fill="none" stroke="#000"/></svg></button>
    </div>
    <textarea id="input" spellcheck="true"></textarea>
    <div class="typing" id="typing"></div>
  </div>
  <div class="bottom">
    <div class="tool" id="t-warn" title="Warn"><svg viewBox="0 0 26 24"><path d="M15 1L5 14h7l-3 9 12-14h-7z" fill="#ffd400" stroke="#c00" stroke-width="1.2" stroke-linejoin="round"/></svg>Warn</div>
    <div class="tool" id="t-block" title="Block (closes window)"><svg viewBox="0 0 26 24"><circle cx="13" cy="12" r="10" fill="none" stroke="#c00" stroke-width="2.5"/><circle cx="13" cy="7" r="2.2" fill="#ffcc00" stroke="#000" stroke-width=".7"/><path d="M10 10h6l-1 5 2 4h-2l-2-3-2 3H9l2-4z" fill="#ffcc00" stroke="#000" stroke-width=".7"/><path d="M6 5l14 14" stroke="#c00" stroke-width="2.5"/></svg>Block</div>
    <div class="tool" id="t-expr" title="Expressions"><svg viewBox="0 0 26 24"><circle cx="13" cy="12" r="10" fill="#ffd400" stroke="#8a6a00"/><circle cx="9.5" cy="9.5" r="1.4" fill="#000"/><circle cx="16.5" cy="9.5" r="1.4" fill="#000"/><path d="M8 14q5 5 10 0" fill="none" stroke="#000" stroke-width="1.4"/></svg>Expressions</div>
    <div class="grow"></div>
    <div class="tool" id="t-talk" title="Talk (opens in Slack)"><svg viewBox="0 0 26 24"><path d="M6 12a7 7 0 0 1 14 0" fill="none" stroke="#333" stroke-width="2"/><rect x="4" y="11" width="4" height="7" rx="1.5" fill="#555"/><rect x="18" y="11" width="4" height="7" rx="1.5" fill="#555"/><path d="M20 18q0 3-5 3" fill="none" stroke="#333"/></svg>Talk</div>
    <div class="tool" id="t-info" title="Get Info (opens in Slack)"><svg viewBox="0 0 26 24"><rect x="3" y="4" width="20" height="15" rx="1" fill="#fffbe0" stroke="#8a7a3a"/><circle cx="8" cy="10" r="2.5" fill="#ffcc00" stroke="#000" stroke-width=".8"/><path d="M5 16q3-4 6 0" fill="#ffcc00" stroke="#000" stroke-width=".8"/><path d="M13 9h7M13 12h7M13 15h5" stroke="#8a7a3a"/></svg>Get Info</div>
    <button class="send" id="send"><span class="man"></span>Send</button>
  </div>
</div>
<div class="emoji-pop" id="emoji"></div>
<script src="common.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const convId = params.get('conv');
  const popup = params.get('popup') === '1';
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  let conv = null, warning = 0, lastTs = null;
  const shown = new Set();

  titlebar('Instant Message');
  const warn = document.createElement('div');
  warn.className = 'warn';
  document.querySelector('.client').prepend(menubar({
    'File': [['Save...', () => {}], '-', ['Close', () => aim.win('close')]],
    'Edit': [['Copy', () => document.execCommand('copy')], ['Paste', () => { input.focus(); document.execCommand('paste'); }], ['Select All', () => input.select()]],
    'Insert': [['Smiley', () => toggleEmoji()], ['Hyperlink...', () => insertLink()]],
    'People': [['Get Info', () => aim.invoke('open-in-slack', convId)], ['Open in Slack', () => aim.invoke('open-in-slack', convId)]],
  }, warn));

  function renderWarn() { warn.textContent = `${conv?.name || ''}'s Warning Level: ${warning}%`; }

  function addMessage(m, { animate } = {}) {
    if (shown.has(m.ts)) return;
    shown.add(m.ts);
    lastTs = m.ts;
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    const div = document.createElement('div');
    div.className = 'msg' + (m.self ? ' self' : '');
    let body = mrkdwn(m.text, m.mentionNames);
    if (m.subtype === 'me_message') body = `<i>${body}</i>`;
    const extras = [
      ...m.files.map(f => `<a href="${escapeHtml(f.url || '#')}" target="_blank">[file: ${escapeHtml(f.name || 'file')}]</a>`),
      ...m.attachments.map(a => `<span class="extra">[${escapeHtml(a.slice(0, 160))}]</span>`),
    ];
    if (m.replies) extras.push(`<span class="link" data-slack>(${m.replies} ${m.replies === 1 ? 'reply' : 'replies'} in Slack)</span>`);
    div.innerHTML = `<span class="who"></span> <span class="ts">(${timeLabel(m.ts)})</span><span class="who">:</span> ${body}${extras.length ? ' ' + extras.join(' ') : ''}`;
    div.querySelector('.who').textContent = m.name;
    div.querySelector('[data-slack]')?.addEventListener('click', () => aim.invoke('open-in-slack', convId));
    log.appendChild(div);
    if (atBottom || animate) log.scrollTop = log.scrollHeight;
  }

  async function loadHistory() {
    const r = await aim.invoke('history', convId, document.hasFocus());
    log.innerHTML = '';
    shown.clear();
    if (r.error) { log.innerHTML = `<div class="note">Could not load messages: ${escapeHtml(r.error)}</div>`; return; }
    if (r.messages.length) log.insertAdjacentHTML('beforeend', '<div class="sys">— earlier messages —</div>');
    r.messages.forEach(m => addMessage(m));
    log.scrollTop = log.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    play('imsend');
    const r = await aim.invoke('send', convId, text);
    if (!r.ok) {
      log.insertAdjacentHTML('beforeend', `<div class="note">Message could not be sent (${escapeHtml(r.error)}).</div>`);
      input.value = text;
    }
  }
  document.getElementById('send').onclick = send;
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

  // formatting -> Slack mrkdwn
  function wrap(mark) {
    const { selectionStart: a, selectionEnd: b, value } = input;
    if (a === b) return input.focus();
    input.value = value.slice(0, a) + mark + value.slice(a, b) + mark + value.slice(b);
    input.focus(); input.setSelectionRange(a, b + 2 * mark.length);
  }
  document.getElementById('b-b').onclick = () => wrap('*');
  document.getElementById('b-i').onclick = () => wrap('_');
  document.getElementById('b-u').onclick = () => wrap('~');
  function insertLink() {
    const url = prompt('Enter the URL:', 'http://');
    if (!url || url === 'http://') return;
    const { selectionStart: a, selectionEnd: b, value } = input;
    const label = value.slice(a, b);
    input.value = value.slice(0, a) + (label ? `<${url}|${label}>` : url) + value.slice(b);
    input.focus();
  }
  document.getElementById('b-link').onclick = insertLink;
  document.getElementById('b-pic').onclick = () => aim.invoke('open-in-slack', convId);
  document.getElementById('b-mail').onclick = () => aim.invoke('open-in-slack', convId);

  const pop = document.getElementById('emoji');
  [':)', ':(', ';)', ':P', ':D', ':O', 'B)', ':-*', ':\'(', '>:o', ':-$', 'O:)'].forEach((code, i) => {
    const em = ['🙂', '🙁', '😉', '😛', '😀', '😮', '😎', '😘', '😢', '😠', '🤑', '😇'][i];
    const s = document.createElement('span');
    s.textContent = em; s.title = code;
    s.onclick = () => { input.setRangeText(em, input.selectionStart, input.selectionEnd, 'end'); input.focus(); pop.classList.remove('open'); };
    pop.appendChild(s);
  });
  function toggleEmoji() { pop.classList.toggle('open'); }
  document.getElementById('b-smile').onclick = e => { e.stopPropagation(); toggleEmoji(); };
  document.getElementById('t-expr').onclick = e => { e.stopPropagation(); toggleEmoji(); };
  document.addEventListener('click', e => { if (!pop.contains(e.target)) pop.classList.remove('open'); });

  // Warn is purely local nostalgia: it never touches Slack.
  document.getElementById('t-warn').onclick = () => {
    warning = Math.min(100, warning + 10 + Math.floor(Math.random() * 10));
    renderWarn(); warn.classList.remove('warnflash'); void warn.offsetWidth; warn.classList.add('warnflash');
  };
  document.getElementById('t-block').onclick = () => aim.win('close');
  document.getElementById('t-talk').onclick = () => aim.invoke('open-in-slack', convId);
  document.getElementById('t-info').onclick = () => aim.invoke('open-in-slack', convId);

  // drag the divider between the log and the input
  document.getElementById('split').onmousedown = e => {
    const start = e.clientY, h = input.offsetHeight;
    const move = ev => { input.style.height = Math.max(40, Math.min(300, h - (ev.clientY - start))) + 'px'; };
    const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  };

  let typingTimer;
  aim.on('typing', name => {
    const t = document.getElementById('typing');
    t.textContent = `${name} is typing a message...`;
    clearTimeout(typingTimer); typingTimer = setTimeout(() => (t.textContent = ''), 4000);
  });
  aim.on('message', m => {
    document.getElementById('typing').textContent = '';
    addMessage(m, { animate: m.self });
    if (!m.self) {
      play('imrcv');
      if (document.hasFocus()) aim.invoke('mark-read', convId, m.ts);
    }
  });
  aim.on('refresh', loadHistory);
  window.addEventListener('focus', () => { if (lastTs) aim.invoke('mark-read', convId, lastTs); input.focus(); });

  aim.invoke('conv', convId).then(c => {
    conv = c;
    const label = c.kind === 'channel' ? `#${c.name}` : c.name;
    setTitle(c.kind === 'channel' ? `${label} - Chat` : `${label} - Instant Message`);
    renderWarn();
    loadHistory().then(() => { if (popup) play('imrcv'); });
    input.focus();
  });
</script>
</body>
</html>
